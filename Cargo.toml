[package]
name = "weft"
version = "0.5.0"
edition = "2024"
description = "The interface for RingFrame: your coding agents in panes, and one list of what was asked, checked and decided"
license = "Apache-2.0"
repository = "https://github.com/fab7hq/weft"

# The binary. It starts the daemon or the terminal client; the work is in the
# crates below.
[workspace]
members = ["crates/*"]
# Without this, a bare `cargo test` here runs the binary's own tests and none of
# the crates', which is fifteen of nearly three hundred and looks like a pass.
default-members = [".", "crates/*"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29"
ratatui = "0.30.2"
serde_json = "1.0.151"
weft-core = { path = "crates/weft-core" }
weft-proto = { path = "crates/weft-proto" }
weft-remote = { path = "crates/weft-remote" }
weft-tui = { path = "crates/weft-tui" }
weftd = { path = "crates/weftd" }

[dev-dependencies]
insta = "1"
weft-core = { path = "crates/weft-core", features = ["fixtures"] }
sha2 = "0.10"
tempfile = "3"
vt100 = "0.16.2"

# No debug info in dev and test builds. On macOS debug info keeps every object
# file in target/debug/deps, and cargo never removes the stale ones: about 4,500
# more per edit of weft-core, 1.1 million by 2026-10-10, and every rustc call
# spent 30 s listing them. Panics still name their file and line.
[profile.dev]
debug = false

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Reads the code and nothing else; actions are pinned to commits.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Both, because the core shells out to git, curl and tar, and those differ.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the desktop app's libraries
        # GPUI's Wayland, X11 and Vulkan; its tests need no screen.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libzstd-dev libvulkan1
      - name: Identify git
        # The fixtures make commits; a runner has no identity of its own.
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Put this repository's own ringframe on PATH, configured
        # Weft shells out to `ringframe`, and since the merge the CLI it talks
        # to is built right here. Before, CI had nothing to point at and the
        # tests that use it could only skip. Reading a profile needs a
        # configuration home as well as a binary, so install the fixture one.
        run: |
          cargo build -p ringframe
          echo "$PWD/target/debug" >> "$GITHUB_PATH"
          ./target/debug/ringframe init --global \
            --from crates/ringframe/tests/fixtures/config
      - name: The Sense bundle this Weft pins, where a first start puts it
        # The model's tests read it; Weft downloads it rather than ship it.
        # Checked as Weft checks it: the manifest against the digest
        # versions.rs names, each file against the manifest.
        run: |
          set -eu
          v=crates/weftd/src/versions.rs
          url=$(sed -n 's/^pub const SENSE_URL: &str = "\(.*\)";/\1/p' "$v")
          want=$(grep -A1 '^pub const SENSE_MANIFEST_SHA256' "$v" | grep -oE '[0-9a-f]{64}')
          dir="$HOME/.fab7/sense/fab7-sense-v1"
          mkdir -p "$dir"
          for f in manifest.json sense.int8.onnx tokenizer.json golden_vectors.jsonl; do
              curl -fsSL --retry 3 -o "$dir/$f" "$url/$f"
          done
          sum() { shasum -a 256 "$1" | cut -d' ' -f1; }
          [ "$(sum "$dir/manifest.json")" = "$want" ] || { echo "manifest.json is not the pinned one"; exit 1; }
          python3 - "$dir" <<'PY'
          import hashlib, json, pathlib, sys
          d = pathlib.Path(sys.argv[1])
          for f in json.loads((d / "manifest.json").read_text())["files"].values():
              assert hashlib.sha256((d / f["path"]).read_bytes()).hexdigest() == f["sha256"], f["path"]
          PY
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release-build:
    # What release.yml builds, built on every push, so a tag never finds out
    # first that a platform cannot build (rustls's `ring` needs a C compiler
    # for each target).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            desktop: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            desktop: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            desktop: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            desktop: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # What a release carries for a first start: fab7's files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fab7hq/fab7
          path: fab7
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }},${{ matrix.desktop }}
      - name: Install the musl toolchain and the desktop app's libraries
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libxkbcommon-dev libxkbcommon-x11-dev \
              libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
              libzstd-dev libvulkan1
      - run: cargo build --release --locked --target "$TARGET" --bin weft --bin ringframe
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$DESKTOP" --bin weft-desktop
        env:
          DESKTOP: ${{ matrix.desktop }}
      - name: Pack, as a release does
        env:
          TARGET: ${{ matrix.target }}
          DESKTOP: ${{ matrix.desktop }}
        run: bin/pack ci "$TARGET" "target/$TARGET/release" "target/$DESKTOP/release" fab7
      - name: Check what was built runs
        if: matrix.target == 'aarch64-apple-darwin' || endsWith(matrix.target, '-musl')
        env:
          TARGET: ${{ matrix.target }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          "./target/$TARGET/release/ringframe" --version
          "./target/$TARGET/release/weft" --help > /dev/null
          "./target/$DESKTOP/release/weft-desktop" --version

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and publish
        required: true

# `install.sh` downloads what this publishes. Nothing is built on a user's
# machine, so a platform missing here is a platform nobody can install on.
#
# What ships is built from the tag itself, with no cache from another run,
# every action pinned to a commit, and a provenance attestation for each
# archive (`gh attestation verify <archive> --repo fab7hq/weft`). Only the job
# that publishes may write.
permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `desktop`: the target the desktop app is built for. On Linux it is
        # the system's own C library, which its graphics come from.
        include:
          - target: aarch64-apple-darwin
            desktop: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            desktop: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            desktop: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            desktop: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # fab7's files a first start sets its home up from, at fab7's latest
      # release: the configuration install.sh installs.
      # Asked with the run's token: a shared runner's address may be out of
      # GitHub's anonymous requests.
      - name: fab7's latest release
        id: fab7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/fab7hq/fab7/releases/latest |
              sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$tag" ] || { echo "fab7 has no release"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fab7hq/fab7
          ref: refs/tags/${{ steps.fab7.outputs.tag }}
          path: fab7
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }},${{ matrix.desktop }}
      - name: Install the musl toolchain and the desktop app's libraries
        # weft and ringframe statically linked, so one Linux build runs on
        # every distribution rather than tracking a glibc version; the app
        # links the system's Wayland, X11 and Vulkan.
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libxkbcommon-dev libxkbcommon-x11-dev \
              libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
              libzstd-dev libvulkan1

      - run: cargo build --release --locked --target "$TARGET" --bin weft --bin ringframe
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$DESKTOP" --bin weft-desktop
        env:
          DESKTOP: ${{ matrix.desktop }}

      - name: Pack and checksum
        id: pack
        env:
          TARGET: ${{ matrix.target }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          set -eu
          case "$TAG" in
              v[0-9]*) ;;
              *) echo "not a release tag: $TAG"; exit 1 ;;
          esac
          # As install.sh reads it: Weft.app on macOS, signed ad hoc here (the
          # owner's identity signs only on the owner's Mac); the programs, the
          # desktop entry and the icon on Linux.
          bin/pack "$TAG" "$TARGET" "target/$TARGET/release" "target/$DESKTOP/release" fab7
          echo "archive=fab7-$TAG-$TARGET.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Check what was built actually runs
        # A cross-built binary that cannot start is worse than no binary.
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
          DESKTOP: ${{ matrix.desktop }}
        run: |
          "./target/$TARGET/release/ringframe" --version
          "./target/$TARGET/release/weft" --help > /dev/null
          "./target/$DESKTOP/release/weft-desktop" --version
          mkdir unpacked && tar -xzf "fab7-$TAG-$TARGET.tar.gz" -C unpacked
          if [ -d unpacked/Weft.app ]; then codesign --verify --deep --strict unpacked/Weft.app; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.pack.outputs.archive }}
            ${{ steps.pack.outputs.archive }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: Refuse a partial release
        # Four platforms or none: install.sh has no fallback to building.
        run: |
          set -eu
          count=$(ls -1 fab7-*.tar.gz | wc -l | tr -d ' ')
          [ "$count" -eq 4 ] || { echo "only $count of 4 platforms built"; exit 1; }
          ls -l fab7-* install.sh
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            fab7-*.tar.gz
            install.sh
      # `weft update` and the README run this release's own install.sh, never
      # main's. The release is made by hand, as a draft with its notes, by
      # the account that pushed the tag; this only uploads into it, so no
      # release is ever the workflow's own. Without one it fails.
      - name: Upload into the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null ||
              { echo "no release $TAG: make it first with gh release create $TAG --draft"; exit 1; }
          gh release upload "$TAG" fab7-*.tar.gz fab7-*.tar.gz.sha256 install.sh \
              --repo "$GITHUB_REPOSITORY" --clobber

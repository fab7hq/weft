[package]
name = "weft-core"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

# The rules, and nothing that does anything.
#
# This crate may not reach the filesystem, a process, the network or
# a terminal. Every dependency added here has to keep that true — which is why
# there is only one, and it parses.
[dependencies]
# Both parse. Nothing here reaches anything, which is the rule this list keeps.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"

[package]
name = "weft-core"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"

# The rules, and nothing that does anything.
#
# This crate may not reach the filesystem, a process, the network or
# a terminal. Every dependency added here has to keep that true — which is why
# every one of them parses.
[dependencies]
# They parse and hash. Nothing here reaches anything, which is the rule this list keeps.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

[features]
# The fixture harness profiles, for the tests of the crates above.
fixtures = []

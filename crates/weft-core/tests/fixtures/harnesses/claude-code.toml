# Weft harness file: Claude Code. What Weft needs to start this harness, pick a
# session back up and set its plugin up, and nothing RingFrame reads: RingFrame's
# own facts about it are in its profile. Shipped by fab7; `install.sh` and
# `weft update` copy it into ~/.fab7/weft/harnesses/, replaced on every update.
# Never edit the copy.
title = "Claude Code"
program = "claude"
# How a recorded session is opened again; the id is appended.
resume = ["--resume"]
# No `transcript`: it prints inline, so the terminal keeps its history.
# Turbo mode, when Weft's config.toml turns it on: every permission granted and no
# question asked, for a person who wants the agent to run on its own.
turbo = ["--dangerously-skip-permissions"]
# What an agent's pane does not inherit from Weft's daemon: the marks of a Claude
# Code session the daemon was started from. Inherited, they make Claude a child
# session that saves no transcript, so it cannot be resumed.
unset_env = [
  "CLAUDECODE",
  "CLAUDE_CODE_SESSION_ID",
  "CLAUDE_CODE_CHILD_SESSION",
  "CLAUDE_CODE_SESSION_ATTENDED",
  "CLAUDE_CODE_BRIDGE_SESSION_ID",
]

[config]   # where it keeps its configuration
env = "CLAUDE_CONFIG_DIR"
default = ".claude"

[plugin]   # the argv for each, as Weft's readiness and RingFrame views run them
list = ["plugin", "list", "--available", "--json"]
add_marketplace = ["plugin", "marketplace", "add", "fab7hq/fab7"]
install = ["plugin", "install", "rf@fab7", "--scope", "user"]
update_marketplace = ["plugin", "marketplace", "update", "fab7"]
update = ["plugin", "update", "rf@fab7"]
# Taking it out again, for a local reinstall: the plugin, the marketplace, and
# the cache it keeps under its configuration home, so an edit lands without a
# version bump.
uninstall = ["plugin", "uninstall", "rf@fab7"]
remove_marketplace = ["plugin", "marketplace", "remove", "fab7"]
cache = "plugins/cache/fab7"

[plugin.listing]   # how what `list` answers reads: where it has them, what names one, and what says one is off
installed = ["installed"]
available = ["available"]
name = "id"
on = ["enabled"]

# What each of its hooks means to Weft (ADR-0030 D4). RingFrame's plugin registers
# these hooks, every one running `weft-signal <id> <hook>`; fab7's check keeps the
# two in step. Payload paths are dotted; `forward` passes a prompt or a tool to
# `ringframe observe` (D9).
# A long `/goal` reaches the prompt hook as Claude Code's own `Goal set:
# <objective>`; the transcript keeps the objective as sent in its newest
# goal_status line, written again on every turn the goal is set
# (claude-code 2.1.296).
[signal]
session = "session_id"
workspace = "cwd"
prompt = [
  "prompt",
  { file = "transcript_path", newest = true, last = { type = "attachment", "attachment.type" = "goal_status" }, field = "attachment.condition" },
]
tool = "tool_name"
command = "tool_input.command"
on = [
  { hook = "SessionStart",                             state = "ready" },
  { hook = "UserPromptSubmit",                         state = "working", forward = "prompt" },
  { hook = "PreToolUse",  tool = "AskUserQuestion",    state = "waiting" },
  { hook = "PermissionRequest",                        state = "waiting" },
  { hook = "PostToolUse",                              state = "working", forward = "tool", outcome = "succeeded" },
  { hook = "PostToolUseFailure",                       state = "working", forward = "tool", outcome = "failed" },
  { hook = "Stop",                                     state = "turn_ended" },
  { hook = "SessionEnd",                               state = "ended" },
]

# Its own transcript, `projects/<project>/<session>.jsonl` (Claude Code 2.1.296,
# recorded in HostLab, as the Agent SDK's `SessionMessage` reads it). The
# person's messages are user entries Claude Code marks human; its other user
# entries are tool results, interruptions and injected context. Thinking,
# attachments and bookkeeping entries are not drawn.
[conversation]
verified = "2.1.296 (Claude Code)"
path = "transcript_path"
find = "projects/*/{session}.jsonl"
time = "timestamp"
skip = ["isSidechain", "isMeta"]
person = { when = { type = "user", "origin.kind" = "human" }, text = "message.content" }
agent = { when = { type = "assistant" }, text = "message.content" }
steps = { when = { type = "assistant" }, in = "message.content", kind = "tool_use", call = "id", tool = "name", input = "input" }
outcomes = { when = { type = "user" }, in = "message.content", kind = "tool_result", call = "tool_use_id", failed = { is_error = true } }
argument = { Bash = "command", Read = "file_path", Edit = "file_path", MultiEdit = "file_path", Write = "file_path", NotebookEdit = "notebook_path", Grep = "pattern", Glob = "pattern", WebFetch = "url", WebSearch = "query", Agent = "description" }
names = { Edit = "Update", MultiEdit = "Update" }

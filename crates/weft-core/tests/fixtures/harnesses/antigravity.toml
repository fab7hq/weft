# Weft harness file: Antigravity. What Weft needs to start this harness, pick a
# session back up and set its plugin up, and nothing RingFrame reads: RingFrame's
# own facts about it are in its profile. Shipped by fab7; `install.sh` and
# `weft update` copy it into ~/.fab7/weft/harnesses/, replaced on every update.
# Never edit the copy.
title = "Antigravity"
program = "agy"
# How a recorded conversation is opened again; the id is appended.
resume = ["--conversation"]
# No `transcript` key is documented for the TUI.
# Turbo mode, when Weft's config.toml turns it on: every tool permission approved
# without asking.
turbo = ["--dangerously-skip-permissions"]

[config]   # no variable moves it (none documented); where it keeps its configuration
default = ".gemini/antigravity-cli"

[plugin]   # argv, as Weft's readiness and RingFrame views run them; it has no marketplace commands
list = ["plugin", "list", "--json"]
# No marketplace to add (`plugin install rf@fab7` answers "unknown marketplace"):
# it installs from the repository, cloned at the plugin's own path, named `rf` by
# its plugin.json. A second install replaces it exactly, so it is also the update.
install = ["plugin", "install", "https://github.com/fab7hq/fab7/tree/main/products/ringframe/plugins/antigravity"]
update = ["plugin", "install", "https://github.com/fab7hq/fab7/tree/main/products/ringframe/plugins/antigravity"]
# Taking it out again, for a local reinstall. It keeps no cache: an install
# replaces the plugin exactly.
uninstall = ["plugin", "uninstall", "rf"]

[plugin.listing]   # how what `list` answers reads: where it has them, what names one, and what says one is off
# `--json` prints a bare array, `[]` when nothing is installed, and each row
# gives its version (agy 1.3.4 and 1.3.5; plain `list` answers in words).
installed = ["."]
available = []
name = "name"
on = ["enabled"]

# What each of its hooks means to Weft (ADR-0030 D4). RingFrame's plugin registers
# these hooks, every one running `weft-signal <id> <hook>`; fab7's check keeps the
# two in step. Payload paths are dotted; `forward` passes a prompt or a tool to
# `ringframe observe` (D9).
# A PreToolUse answered without a decision is a deny (agy 1.2.12,
# ringframe-weft-waiting-q01), so that hook answers allow. Its payload's tool
# field is not recorded yet: its hook file registers PreToolUse and
# PostToolUse for ask_question only, and these rows name no tool. Its hooks
# run from the plugin's own directory and name no cwd: the workspace is the
# first of `workspacePaths`; there is no session_id.
[signal]
session = "conversationId"
workspace = "workspacePaths"
# No hook carries the prompt; the transcript the payload names holds it, and
# when PreInvocation follows a typed prompt its last line is that prompt.
prompt = { file = "transcriptPath", last = { type = "USER_INPUT" }, field = "content", between = ["<USER_REQUEST>\n", "\n</USER_REQUEST>"] }
reply = "{}"
on = [
  { hook = "PreInvocation", state = "working", forward = "prompt" },
  { hook = "PreToolUse",    state = "waiting", reply = '{"decision":"allow"}' },
  { hook = "PostToolUse",   state = "working" },
  { hook = "Stop",          state = "turn_ended" },
]

# Its own transcript, `brain/<session>/.system_generated/logs/transcript.jsonl`
# (agy 1.3.5, recorded in HostLab). User prompts are wrapped in `<USER_REQUEST>`;
# free-text `GENERIC` / `TOOL_RESPONSE` step outcomes and `<SYSTEM_MESSAGE>`
# entries are refined by `weft-sense` Head 2.
[conversation]
verified = "agy 1.3.5"
path = "transcriptPath"
find = "brain/{session}/.system_generated/logs/transcript.jsonl"
time = "created_at"
person = { when = { type = "USER_INPUT", source = "USER_EXPLICIT" }, text = "content", between = ["<USER_REQUEST>\n", "\n</USER_REQUEST>"] }
agent = { when = { type = "PLANNER_RESPONSE" }, text = "content" }
steps = { when = { type = "PLANNER_RESPONSE" }, in = "tool_calls", tool = "name", input = "args", call = "step_index" }
outcomes = { when = { type = ["GENERIC", "TOOL_RESPONSE"] }, call = "step_index", text = "content", failed = { status = "ERROR" } }
argument = { run_command = "CommandLine", view_file = "AbsolutePath", write_to_file = "TargetFile", replace_file_content = "TargetFile", ask_question = "questions.0.question", search_web = "query", read_url_content = "Url" }
names = { run_command = "Run", view_file = "Read", write_to_file = "Write", replace_file_content = "Update", ask_question = "Ask" }

# What Settings offers an Eval judge that runs here. Antigravity takes no
# effort per subagent, so an effort changes only how far a judge looks. Its
# models are the tiers a subagent takes. The defaults are RingFrame's plugin's
# agent files'.
[eval]
efforts = ["low", "medium", "high"]
effort = "lookups"
models = ["flash_lite", "flash", "pro"]
default = { map = "low", reduce = "medium", confirm = "medium" }

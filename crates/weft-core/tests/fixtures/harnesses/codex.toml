# Weft harness file: Codex. What Weft needs to start this harness, pick a
# session back up and set its plugin up, and nothing RingFrame reads: RingFrame's
# own facts about it are in its profile. Shipped by fab7; `install.sh` and
# `weft update` copy it into ~/.fab7/weft/harnesses/, replaced on every update.
# Never edit the copy.
title = "Codex"
program = "codex"
# How a recorded session is opened again; the id is appended.
resume = ["resume"]
# Resuming a session another program runs joins it: both are clients of the
# same server, and the turn runs once.
resume_joins = true
# It repaints its viewport rather than scrolling, so its history is behind this.
transcript = "Ctrl+T"
# Turbo mode, when Weft's config.toml turns it on: every approval skipped. Codex has
# no flag that skips its questions and keeps its sandbox, so this also runs commands
# unsandboxed.
turbo = ["--dangerously-bypass-approvals-and-sandbox"]

# Codex 0.162 runs its sessions in one shared server (`codex app-server
# --listen unix://`), started by the first Codex window, and its hooks run
# there. That server is no session's process.
server_args = ["app-server"]

[config]   # where it keeps its configuration
env = "CODEX_HOME"
default = ".codex"

[plugin]   # the argv for each, as Weft's readiness and RingFrame views run them
list = ["plugin", "list", "--json"]
add_marketplace = ["plugin", "marketplace", "add", "fab7hq/fab7"]
install = ["plugin", "add", "rf@fab7"]
update_marketplace = ["plugin", "marketplace", "upgrade", "fab7"]
# Adding again installs the version the refreshed marketplace holds.
update = ["plugin", "add", "rf@fab7"]
# Taking it out again, for a local reinstall: the plugin, the marketplace, and
# the cache it keeps under its configuration home, so an edit lands without a
# version bump.
uninstall = ["plugin", "remove", "rf@fab7"]
remove_marketplace = ["plugin", "marketplace", "remove", "fab7"]
cache = "plugins/cache/fab7"

[plugin.listing]   # how what `list` answers reads: where it has them, what names one, and what says one is off
installed = ["installed"]
available = ["available"]
name = "pluginId"
on = ["enabled", "installed"]

# What each of its hooks means to Weft (ADR-0030 D4). RingFrame's plugin registers
# these hooks, every one running `weft-signal <id> <hook>`; fab7's check keeps the
# two in step. Payload paths are dotted; `forward` passes a prompt or a tool to
# `ringframe observe` (D9).
# No SessionStart row: it runs only with the first prompt. Its server says a
# new session began, ready, as the TUI starts ([listen], thread/started).
# PostToolUse forwards nothing: a failed command also arrives there, so its
# outcome cannot be told.
# A typed prompt is in UserPromptSubmit's payload. A `/goal` fires no prompt
# hook: Codex records it in its transcript as a thread_goal_updated line, the
# prompt without the command, and a long paste as a file that line names; the
# goal turn's first hook is its first tool use or its Stop (HostLab probe
# goal-hooks, codex 0.162.0; Weft ADR-0033 D7).
[signal]
session = "session_id"
workspace = "cwd"
prompt = [
  "prompt",
  { file = "transcript_path", newest = true, last = { type = "event_msg", "payload.type" = "thread_goal_updated" }, field = "payload.goal.objective", names_file = ["pasted text file: ", ". Read this file"] },
]
tool = "tool_name"
on = [
  { hook = "UserPromptSubmit",                         state = "working",    forward = "prompt" },
  { hook = "PreToolUse",  tool = "request_user_input", state = "waiting" },
  { hook = "PermissionRequest",                        state = "waiting" },
  { hook = "PostToolUse",                              state = "working",    forward = "prompt" },
  { hook = "Stop",                                     state = "turn_ended", forward = "prompt" },
]

# A question asked without stopping the turn (`request_user_input_async`)
# returns at once, and its server raises no flag for it: its transcript keeps
# it, as an item_completed whose item is delivered "async", its id the call's.
# The person's answer is a user message that begins with the marker below and
# names that id; a message the person types after it is past it. Pending until
# then: NEEDS YOU (codex 0.162.1).
[signal.questions]
file = "transcript_path"
asked = { type = "event_msg", "payload.type" = "item_completed", "payload.item.delivery" = "async" }
id = "payload.item.id"
answered = { type = "response_item", "payload.type" = "message", "payload.role" = "user" }
answer = "payload.content.0.text"
begins = "<send_user_message_question_reply>"
typed = { type = "event_msg", "payload.type" = "item_completed", "payload.item.type" = "UserMessage" }

# Its server tells every client each session's state, an interrupted turn
# included, which no hook reports (Codex 0.162). A session is the server's
# thread.
# The socket is a WebSocket; `codex app-server proxy` only relays bytes to it.
[listen]
socket = "app-server-control/app-server-control.sock"
transport = "websocket"
hello = [
  { id = 1, method = "initialize", params = { clientInfo = { name = "weft", version = "1" } } },
  { method = "initialized" },
]
session = "params.threadId"
on = [
  { method = "thread/started", when = { "params.thread.ephemeral" = false, "params.thread.threadSource" = "user", "params.thread.status.type" = "idle" }, session = "params.thread.id", workspace = "params.thread.cwd", state = "ready" },
  { method = "thread/status/changed", when = { "params.status.activeFlags" = "waitingOnApproval" },  state = "waiting" },
  { method = "thread/status/changed", when = { "params.status.activeFlags" = "waitingOnUserInput" }, state = "waiting" },
  { method = "thread/status/changed", when = { "params.status.type" = "active" },                    state = "working" },
  { method = "thread/status/changed", when = { "params.status.type" = "idle" },                      state = "turn_ended" },
]

# Its own transcript, the rollout file (codex-cli 0.162.1, recorded in
# HostLab). Read from what its screen drew (`event_msg` `item_completed`), not
# the model's input (`response_item`), which also holds injected context as
# user messages. Each step is written once it completes, so it carries its own
# outcome.
[conversation]
verified = "codex-cli 0.162.1"
path = "transcript_path"
find = "sessions/*/*/*/rollout-*-{session}.jsonl"
time = "timestamp"
person = { when = { type = "event_msg", "payload.type" = "item_completed", "payload.item.type" = "UserMessage" }, text = "payload.item.content" }
agent = { when = { type = "event_msg", "payload.type" = "item_completed", "payload.item.type" = "AgentMessage" }, text = "payload.item.content" }
steps = [
  { when = { type = "event_msg", "payload.type" = "item_completed", "payload.item.type" = "CommandExecution" },
    name = "Ran", input = "payload.item.command", failed = { "payload.item.status" = "failed" } },
  { when = { type = "event_msg", "payload.type" = "item_completed", "payload.item.type" = "FileChange" },
    name = "Edited", input = "payload.item.changes.@key", failed = { "payload.item.status" = "failed" } },
  { when = { type = "event_msg", "payload.type" = "item_completed", "payload.item.type" = "McpToolCall" },
    tool = "payload.item.tool", input = "payload.item.arguments", failed = { "payload.item.status" = "failed" } },
]

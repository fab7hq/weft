[package]
name = "weft-remote"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

# `weft remote`: Weft from another device (remote.md). A client of the
# daemon's socket like the TUI, and the only part of Weft that listens on a
# network port: loopback, behind cloudflared. Threads and channels, like the
# daemon; no async runtime.
[dependencies]
anyhow = "1.0.104"
# base64url for assertions, push keys and tokens; already under web-push-native.
base64ct = { version = "1.8.3", features = ["alloc"] }
# Checks Fab7's assertions (remote.md §8).
ed25519-dalek = "3.0.0"
# Tokens, the epoch, device ids.
getrandom = "0.4.3"
# The push request web-push-native builds is an http::Request.
http = "1.4.2"
serde_json = "1.0.151"
# Agent ids and token hashes.
sha2 = "0.11.0"
# devices.toml and machine.toml.
toml = "1.1.6"
# The WebSocket, blocking, one thread per connection.
tungstenite = "0.30.0"
# HTTPS to the account service, GitHub and push services.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# Web Push's encryption, without its own HTTP. Its VAPID feature is off: it
# brings jwt-simple and, through it, the rsa crate (RUSTSEC-2023-0071); the
# ES256 JWT is signed here with p256.
web-push-native = { version = "0.5.0", default-features = false }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8", "pem"] }
weft-core = { path = "../weft-core" }
weft-proto = { path = "../weft-proto" }

# Tests talk to a real daemon, as the TUI's do. Not in the graph of anything
# that ships this crate.
[dev-dependencies]
weft-core = { path = "../weft-core", features = ["fixtures"] }
weftd = { path = "../weftd" }

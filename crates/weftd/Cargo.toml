[package]
name = "weftd"
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"

# The daemon: pane processes, the record on disk, and the RingFrame CLI. One
# per machine, holding every project anyone opens.
[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
portable-pty = "0.9.0"
serde_json = "1.0.151"
toml = "1.1.6"
vt100 = "0.16.2"
weft-core = { path = "../weft-core" }
weft-proto = { path = "../weft-proto" }

[dev-dependencies]
weft-core = { path = "../weft-core", features = ["fixtures"] }
tempfile = "3"

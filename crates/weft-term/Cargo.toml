[package]
name = "weft-term"
version = "1.0.0-beta-1"
edition = "2024"
license = "Apache-2.0"

# Weft's terminal: one emulator for the daemon and the desktop, its text, and
# the escape codes that redraw it on another terminal.
[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }

[dev-dependencies]
serde_json = "1.0.151"
weft-proto = { path = "../weft-proto" }

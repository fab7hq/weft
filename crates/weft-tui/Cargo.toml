[package]
name = "weft-tui"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"

# The terminal client. It draws, and it asks the daemon for everything else.
#
# No `weftd` here. If this could reach the CLI or the record it
# would start re-deriving what the daemon already decided, and a second client
# would disagree with it.
[dependencies]
anyhow = "1.0.104"
crossterm = "0.29"
ratatui = "0.30.2"
serde_json = "1.0.151"
tui-term = "0.3.4"
vt100 = "0.16.2"
weft-core = { path = "../weft-core" }
weft-proto = { path = "../weft-proto" }

# Tests start a real daemon to talk to. A dev-dependency, deliberately: it is
# not in the graph of anything that ships this crate, which is the whole point
# of the split.
[dev-dependencies]
weftd = { path = "../weftd" }

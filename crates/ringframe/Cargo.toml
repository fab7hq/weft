[package]
name = "ringframe"
version = "0.7.0"
edition = "2024"
description = "The record a coding agent's work is measured against: Ask, Eval and Seal over an append-only ledger"
license = "Apache-2.0"
repository = "https://github.com/fab7hq/weft"

# RingFrame's core, in Weft's repository. weftd links this crate and calls it
# only through `ringframe::api`; the `ringframe` binary is built from it too.
[lib]
name = "ringframe"
path = "src/lib.rs"

[[bin]]
name = "ringframe"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1.0.151"
sha2 = "0.10"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3"

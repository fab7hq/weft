# RingFrame host profile: antigravity (authored configuration; identity = sha256 of canonical JSON)
# Antigravity CLI. What is known of it, and how well, is in the knowledge base:
# research/knowledge-base/harnesses/antigravity/capability.md (agy 1.2.8).
schema = "ringframe.profile/1"
profile_id = "antigravity"
host = "antigravity"
surface = "native-tui"
# No paste_fold_chars: not measured on this host, so nothing is assumed.

# What the ringframe CLI reads about this harness. How to start it, resume it and
# set its plugin up is not RingFrame's: those are in the harness's own file for
# the tool that runs it. No text to match on its screen, and no hook payload: the CLI
# reads none (ADR-0022).
# The name a person reads.
title = "Antigravity"
# The folder names this harness's files go by in a repository (its plugin
# folder): how an Eval links a step that names the harness to its files.
path_names = ["antigravity"]

[routing]
precedence = ["native_goal", "native_plan", "native_direct"]

[[capabilities]]
id = "native_goal"
sources = [
  "research/knowledge-base/harnesses/antigravity/capability.md",
  "https://antigravity.google/docs/slash-commands/",
]
purpose = "Antigravity long-running goal, entered by the person with /goal"
activation = {}
continuation = """\
the person submits the prompt; a built-in Stop hook keeps the run going until \
the model marks the goal complete or cancelled"""
effects = ["per source intent"]
permission_owner = "host"
delivery_mode = "human_handoff"
prompt_prefix = "/goal "
prompt_prefix_kind = "inline"   # an agent-directed command: it expands into this turn's instructions
qualification = {}
limitations = [
  "/goal is user-entered on Antigravity; completion is the model's own marker",
  "no prompt hook exists, so a submission is attributed, never observed",
  "forced continuation ends only on the complete or the cancelled marker",
]

[[capabilities]]
id = "native_plan"
sources = [
  "research/knowledge-base/harnesses/antigravity/capability.md",
  "https://antigravity.google/docs/slash-commands/",
]
purpose = "Antigravity plan: a plan artifact and the person's approval before code changes"
activation = {}
continuation = """\
the person submits the prompt; the agent drafts an implementation plan \
artifact and stops for review; approving or commenting on it moves the agent \
into execution"""
effects = ["workspace_read", "workspace_write"]
permission_owner = "host"
delivery_mode = "human_handoff"
prompt_prefix = "/plan "
prompt_prefix_kind = "inline"   # an agent-directed command for this turn
qualification = {}
limitations = [
  "This profile maps Plan to user submission",
  "no prompt hook exists, so a submission is attributed, never observed",
]

[[capabilities]]
id = "native_direct"
sources = ["research/knowledge-base/harnesses/antigravity/capability.md"]
purpose = "continue immediately under normal permissions"
activation = {}
continuation = "same turn"
effects = ["per source intent"]
permission_owner = "host"
delivery_mode = "native_dispatch"
requires_explicit_request_for_effects = [
  "write",
  "execute",
  "external_effect",
  "workspace_write",
]
qualification = {}
limitations = ["no delivery receipt exists for same-turn continuation"]

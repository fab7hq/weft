# RingFrame host profile: claude-code (authored configuration; identity = sha256 of canonical JSON)
schema = "ringframe.profile/1"
profile_id = "claude-code"
host = "claude-code"
surface = "native-tui"
# The composer folds a paste of this many characters or more into a placeholder, and a
# folded paste is not scanned for slash commands. Measured against the installed host:
# claude-code 2.1.278: a paste of 512 characters or more becomes `[Pasted text #N]`.
# A prompt at or over this length cannot carry its command in the same paste.
paste_fold_chars = 512

# What the ringframe CLI reads about this harness. How to start it, resume it and
# set its plugin up is not RingFrame's: those are in the harness's own file for
# the tool that runs it. No text to match on its screen, and no hook payload: the CLI
# reads none (ADR-0022).
# The name a person reads.
title = "Claude Code"
# The folder names this harness's files go by in a repository (its plugin
# folder): how an Eval links a step that names the harness to its files.
path_names = ["claude"]

# Which tools `ringframe observe tool` makes something of (ADR-0022).
[observe]
delivery_tool = "EnterPlanMode"   # its success is a delivery receipt
shell_tool = "Bash"               # its runs are tool facts

[routing]
precedence = ["native_goal", "native_plan", "native_direct"]

[[capabilities]]
id = "native_plan"
sources = ["https://code.claude.com/docs/en/tools-reference"]
purpose = "read-only exploration and a reviewable plan before effects"
activation = { mechanism = "capability_activate", tool = "EnterPlanMode" }
continuation = """\
host presents plan review via ExitPlanMode; approval continues to \
implementation under host permissions"""
# Plan mode reads; the approved continuation writes. Declaring only the
# read half made the profile contradict its own `continuation` line.
effects = ["workspace_read", "workspace_write"]
permission_owner = "host"
delivery_mode = "native_dispatch"
limitations = [
  "ToolSearch denial blocks discovery of EnterPlanMode",
  "native acceptance is not execution or completion",
]

[capabilities.qualification]
# Historical evidence identifiers; records are not distributed with this package.
id = "ringframe-ask-plan-q04"
stratum = "agent-sdk"
tui = "ringframe-ask-confirm-tui-q02 (feasibility only)"

[[capabilities]]
id = "native_direct"
sources = ["https://code.claude.com/docs/en/tools-reference"]
purpose = "continue immediately under normal permissions"
activation = {}
continuation = "same turn"
effects = ["per source intent"]
permission_owner = "host"
delivery_mode = "native_dispatch"
qualification = {}
limitations = [
  "no delivery receipt exists for same-turn continuation",
  """\
with write, execute, or external effects, direct execution requires the \
source intent to ask for it explicitly (route.explicit_direct_request)""",
]
requires_explicit_request_for_effects = [
  "write",
  "execute",
  "external_effect",
  "workspace_write",
]

[[capabilities]]
id = "native_goal"
sources = ["https://code.claude.com/docs/en/goal"]
purpose = "Claude Code persistent goal, entered by the person with /goal"
activation = {}
continuation = """\
the person submits the prompt; setting the goal starts a turn with it as the \
directive; after every turn a separate small model judges the condition from \
the conversation (not met: another turn; met or impossible: the goal clears)"""
effects = ["per source intent"]
permission_owner = "host"
delivery_mode = "human_handoff"
prompt_prefix = "/goal "
prompt_prefix_kind = "inline"   # the argument is the goal; sent alone it only views it
# Measured on claude-code 2.1.278: the host refuses a longer goal condition
# with "Goal condition is limited to 4000 characters". Counted over the whole
# prompt, so the six characters of the prefix come out of the same budget.
max_prompt_chars = 4000
qualification = {}
limitations = [
  "/goal is user-entered on claude-code and limited to 4000 characters",
  "This profile maps Goal to user submission in the TUI",
  "Goal requires workspace trust and hooks permitted by effective host settings",
  "submission is observed only through the host prompt hook",
  "the evaluator reads only the conversation: it runs no command and opens no file",
  """\
a goal does not change the permission mode: in Manual mode tool prompts still \
stop it, and unattended turns need auto mode""",
  "several turns with no tool use stop the loop with the goal still set",
]

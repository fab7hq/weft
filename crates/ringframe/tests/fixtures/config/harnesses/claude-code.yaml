# RingFrame host profile: claude-code (authored configuration; identity = sha256 of canonical JSON)
schema: ringframe.profile/1
profile_id: claude-code
host: claude-code
version_range: null
surface: native-tui
invocation_prefix: '/rf:'
routing:
  precedence:
  - native_goal
  - native_plan
  - native_direct
  guidance:
  - Infer the intended outcome, required continuation, and effects from the source intent; users do not
    need to name a native command.
  - Honor an explicit supported capability choice and preserve planning-only or review-only scope. Never
    invent a completion condition or additional permissions.
  - Compare capability selection guidance; use precedence when multiple capabilities fit. Continuing objectives
    take precedence over the general planning default for work with effects.
  - Large scope, the word fully, or write effects alone do not imply persistent continuation. Explain
    material uncertainty in route gaps and let the user revise the proposed route.
  - When work needs a plan before it can be built, the Ask that produces the plan delivers the plan
    itself. Classify it as task plan with result plan, even when the source intent names the change
    the plan is for. Building is a later Ask that reads what was written. Classification happens
    before a capability is chosen, so decide this from the work rather than from the route; one Ask
    classified as both draws rules for work that turn will not do.
  - A declared capability is a RingFrame integration contract, not proof that the current host exposes
    it. Follow its delivery mode and limitations; report unavailable tools or rejected commands without
    claiming activation.
# The composer folds a paste of this many characters or more into a placeholder, and a
# folded paste is not scanned for slash commands. Measured against the installed host:
# claude-code 2.1.278: a paste of 512 characters or more becomes `[Pasted text #N]`.
# A prompt at or over this length cannot carry its command in the same paste.
paste_fold_chars: 512
capabilities:
- id: native_plan
  selection: A plan or analysis before implementation, or bounded work with effects when the user has not
    requested immediate execution. Do not prefer this general default over a fitting continuing objective
    or dedicated review.
  sources:
  - https://code.claude.com/docs/en/tools-reference
  purpose: read-only exploration and a reviewable plan before effects
  activation:
    mechanism: capability_activate
    tool: EnterPlanMode
  confirmation:
    tool: AskUserQuestion
  continuation: host presents plan review via ExitPlanMode; approval continues to implementation under
    host permissions
  effects:
  - workspace_read
  # Plan mode reads; the approved continuation writes. Declaring only the
  # read half made the profile contradict its own `continuation` line.
  - workspace_write
  permission_owner: host
  delivery_mode: native_dispatch
  receipt:
    captured_by: hook:PostToolUse
    tool: EnterPlanMode
  qualification:
    # Historical evidence identifiers; records are not distributed with this package.
    id: ringframe-ask-plan-q04
    stratum: agent-sdk
    tui: ringframe-ask-confirm-tui-q02 (feasibility only)
  limitations:
  - ToolSearch denial blocks discovery of EnterPlanMode
  - native acceptance is not execution or completion
- id: native_direct
  selection: An answer, read-only investigation, or review without a fitting dedicated capability; also
    work the user explicitly asks to execute immediately or without planning. Effects listed in requires_explicit_request_for_effects
    require that explicit source intent.
  sources:
  - https://code.claude.com/docs/en/tools-reference
  purpose: continue immediately under normal permissions
  activation:
    mechanism: null
    tool: null
  confirmation:
    tool: AskUserQuestion
  continuation: same turn
  effects:
  - per source intent
  permission_owner: host
  delivery_mode: native_dispatch
  receipt: null
  qualification:
    id: null
  limitations:
  - no delivery receipt exists for same-turn continuation
  - with write, execute, or external effects, direct execution requires the source intent to ask for it
    explicitly (route.explicit_direct_request)
  requires_explicit_request_for_effects:
  - write
  - execute
  - external_effect
  - workspace_write
- id: native_goal
  selection: A continuing objective with a user-supplied terminal condition, where work should continue
    until that condition is met. Infer this from the intended continuation, without requiring the word goal.
    Do not select for a plan-only or review-only request.
  sources:
  - https://code.claude.com/docs/en/goal
  purpose: Claude Code persistent goal, entered by the person with /goal
  activation: {mechanism: null, tool: null}
  confirmation: {tool: AskUserQuestion}
  continuation: the person submits the prompt; Claude Code keeps the objective attached to the session
  effects: [per source intent]
  permission_owner: host
  delivery_mode: human_handoff
  prompt_prefix: '/goal '
  # the argument is the goal; sent alone it only views it
  prompt_prefix_kind: inline
  receipt: null
  qualification: {id: null}
  limitations:
  - This profile maps Goal to user submission in the TUI
  - Goal requires workspace trust and hooks permitted by effective host settings
  - submission is observed only through the host prompt hook
subagents: true
fallback: human_handoff

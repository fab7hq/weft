# RingFrame host profile: codex (authored configuration; identity = sha256 of canonical JSON)
schema: ringframe.profile/1
profile_id: codex
host: codex
version_range: null
surface: native-tui
invocation_prefix: '$rf:'
confirmation:
  tool: request_user_input
  requires_feature: null
routing:
  precedence:
  - native_goal
  - native_review
  - native_plan
  - native_direct
  guidance:
  - Infer the intended outcome, required continuation, and effects from the source intent; users do not
    need to name a native command.
  - Honor an explicit supported capability choice and preserve planning-only or review-only scope. Never
    invent a completion condition or additional permissions.
  - Compare capability selection guidance; use precedence when multiple capabilities fit. Continuing objectives
    take precedence over the general planning default for work with effects.
  - Large scope, the word fully, or write effects alone do not imply persistent continuation. Explain
    material uncertainty in route gaps and let the user revise the proposed route.
  - A plan-first route delivers the plan itself, not the change it describes. Classify such an Ask as
    task plan with result plan, and leave building to a later Ask that reads what was written. Loading
    one Ask with both fills the prompt with rules for work this turn will not do.
  - A declared capability is a RingFrame integration contract, not proof that the current host exposes
    it. Follow its delivery mode and limitations; report unavailable tools or rejected commands without
    claiming activation.
# The composer folds a paste of this many characters or more into a placeholder, and a
# folded paste is not scanned for slash commands. Measured against the installed host:
# codex 0.155.1: a paste of 1001 characters or more becomes `[Pasted Content N chars]`.
# A prompt at or over this length cannot carry its command in the same paste.
paste_fold_chars: 1001
capabilities:
- id: native_plan
  selection: A plan or analysis before implementation, or bounded work with effects when the user has not
    requested immediate execution. Do not prefer this general default over a fitting continuing objective
    or dedicated review.
  sources:
  - https://developers.openai.com/codex/cli/slash-commands
  purpose: Codex Plan mode, entered by the person with /plan
  activation:
    mechanism: null
    tool: null
  confirmation:
    tool: request_user_input
  continuation: the person submits the prompt; Codex Plan mode owns research and review
  effects:
  - workspace_read
  # Plan mode reads; the approved continuation writes. Declaring only the
  # read half made the profile contradict its own `continuation` line.
  - workspace_write
  permission_owner: host
  delivery_mode: human_handoff
  prompt_prefix: '/plan '
  # switch to Plan mode; it persists for the session
  prompt_prefix_kind: mode
  prompt_prefix_active: Plan mode   # shown by the host once the mode is on
  receipt: null
  qualification:
    id: null
  limitations:
  - This profile maps Plan to user submission; it does not invoke a mode-transition tool
  - submission is observed only through the host prompt hook
- id: native_goal
  selection: A continuing objective with a user-supplied terminal condition, where work should continue
    until that condition is met. Infer this from the intended continuation, without requiring the word goal.
    Do not select for a plan-only or review-only request.
  sources:
  - https://developers.openai.com/codex/cli/slash-commands
  purpose: Codex persistent chat goal, entered by the person with /goal
  activation:
    mechanism: null
    tool: null
  confirmation:
    tool: request_user_input
  continuation: the person submits the prompt; Codex keeps the objective attached to the chat
  effects:
  - per source intent
  permission_owner: host
  delivery_mode: human_handoff
  prompt_prefix: '/goal '
  # the argument is the objective; sent alone it only views the goal
  prompt_prefix_kind: inline
  max_prompt_chars: 4000
  receipt: null
  qualification:
    id: null
  limitations:
  - /goal is user-entered on Codex and limited to 4000 characters
  - submission is observed only through the host prompt hook
- id: native_direct
  selection: An answer, read-only investigation, or review without a fitting dedicated capability; also
    work the user explicitly asks to execute immediately or without planning. Effects listed in requires_explicit_request_for_effects
    require that explicit source intent.
  sources:
  - https://developers.openai.com/codex/sandboxing
  purpose: continue immediately under normal permissions
  activation:
    mechanism: null
    tool: null
  confirmation:
    tool: request_user_input
  continuation: same turn
  effects:
  - per source intent
  permission_owner: host
  delivery_mode: native_dispatch
  requires_explicit_request_for_effects:
  - write
  - execute
  - external_effect
  - workspace_write
  receipt: null
  qualification:
    id: null
  limitations:
  - no delivery receipt exists for same-turn continuation
- id: native_review
  selection: Review existing code changes for bugs, regressions, or missing tests and report findings
    without implementing fixes. For review followed by implementation, choose a route covering the whole
    intent.
  sources:
  - https://developers.openai.com/codex/cli/slash-commands
  - https://github.com/openai/codex/blob/main/codex-rs/tui/src/slash_command.rs
  purpose: Native code review with the compiled prompt as custom review instructions
  activation:
    mechanism: null
    tool: null
  confirmation:
    tool: request_user_input
  continuation: The person submits the prompt; Codex reviews the specified changes and reports findings.
  effects:
  - workspace_read
  permission_owner: host
  delivery_mode: human_handoff
  prompt_prefix: '/review '
  # a one-shot action over the current changes
  prompt_prefix_kind: inline
  receipt: null
  qualification:
    id: null
  limitations:
  - User submission is required by this RingFrame mapping.
  - Installed native review invocation and semantic routing are not qualified by CLI tests.
subagents: true
fallback: human_handoff

# RingFrame host deltas for Codex. Rendered by the CLI only when `status: qualified`.
schema: ringframe.deltas/1
scope: host
host: codex
entries:
  - id: codex.native_plan.hand_back
    label: Hand back
    status: candidate
    capability: native_plan
    text: >-
      End the plan with the exact checks the implementer must run; the person
      reviews and leaves Plan mode themselves.
    why: >-
      /plan is user-entered and read-only; there is no model transition out of
      it.
    matrix_ref: https://github.com/fab7hq/ringframe/blob/main/docs/commands/ask.md#codex
    evidence: null
  - id: codex.native_goal.item_loop
    label: Item loop
    status: candidate
    capability: native_goal
    text: >-
      Work the plan one item at a time, in order. Per item: analyze the
      current implementation against the item; implement test-first; review
      the change.
    why: >-
      A persistent objective needs an iteration shape; the owner's loop is
      analyze, TDD, code review. Outcome judgement belongs to rf:eval.
    matrix_ref: https://github.com/fab7hq/ringframe/blob/main/docs/commands/ask.md#codex
    evidence: null
  - id: codex.native_goal.terminal_condition
    label: Terminal condition
    status: candidate
    capability: native_goal
    text: >-
      Done when every item has been through the loop; then stop and report
      what remains open.
    why: >-
      /goal keeps the objective attached until cleared; without a terminal
      condition it never ends.
    matrix_ref: https://github.com/fab7hq/ringframe/blob/main/docs/commands/ask.md#codex
    evidence: null

[package]
name = "weft-sense"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
# ONNX Runtime 1.31, linked statically.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-31"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
unicode-normalization = "0.1.26"

# WebGPU, on Metal: the GPU a Mac gives Sense. Its Dawn library goes beside
# each program, which finds it there (`.cargo/config.toml`).
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["webgpu", "copy-dylibs"] }

[dev-dependencies]
tempfile = "3"

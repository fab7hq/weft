[package]
name = "weft-desktop"
version = "0.6.2"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "weft-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# Zed's weekly GPUI snapshot, pinned: a newer one is a deliberate bump of both.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
unicode-segmentation = "1.13"
weft-core = { path = "../weft-core" }
weft-proto = { path = "../weft-proto" }
weft-term = { path = "../weft-term" }

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux, GPUI's own Wayland and X11 windows.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["wayland", "x11"] }

[dev-dependencies]
# A window without a screen, for typing into the text fields in tests.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
tempfile = "3"
ttf-parser = "0.25"
weft-core = { path = "../weft-core", features = ["fixtures"] }
weftd = { path = "../weftd" }

[package]
name = "weft-proto"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"

# The wire, and the types on it. No processes, no panes, no terminal: a client
# in any language could speak the protocol directly; this is only what Weft's
# own clients use instead of writing it twice.
[dependencies]
serde_json = "1.0.151"
weft-core = { path = "../weft-core" }
